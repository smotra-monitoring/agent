name: Release

on:
  release:
    types: ['published']

permissions:
  contents: read

# Passed via env (not inline expressions) to avoid script injection from tag names.
env:
  RELEASE_TAG: ${{ github.ref_name }}
  REPO_NAME: ${{ github.event.repository.name }}

jobs:
  prepare:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Print debug info
        run: |
          echo "RELEASE_TAG: ${RELEASE_TAG}"
          echo "GITHUB_REF: ${GITHUB_REF}"
          echo "GITHUB_EVENT_NAME: ${GITHUB_EVENT_NAME}"
          echo "GITHUB_EVENT_PATH: ${GITHUB_EVENT_PATH}"
          echo "GITHUB_REPOSITORY: ${GITHUB_REPOSITORY}"
          echo "GITHUB_SHA: ${GITHUB_SHA}"
          echo "GITHUB_ACTOR: ${GITHUB_ACTOR}"

      - name: Resolve version from release tag
        id: version
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
            echo "ERROR: release tag '${RELEASE_TAG}' is not a valid version (expected [v]MAJOR.MINOR.PATCH[-suffix])."
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  release-pre-checks:
    name:  Test, lint and attempt to build
    needs: prepare
    runs-on: ubuntu-latest

    steps:
    - name: checkout code
      uses: actions/checkout@v7

    - name: Run clippy
      run: cargo clippy --verbose --all-targets --all-features  -- -D warnings

    - name: Run tests
      run: cargo test --verbose

    - name: Run fmt
      run: cargo fmt -- --check

    - name: Install dependencies
      run: cargo build

  create-release:
    name: create-release
    needs: ['release-pre-checks']
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create release if it does not exist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" &>/dev/null; then
            echo "Release exists, no need to create"
          else
            echo "No release found, creating one"
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG"
          fi

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: [prepare, create-release]
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: x86_64-pc-windows-gnu
          - os: windows-latest
            target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v7
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 2. Add caching to make subsequent runs much faster
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      
      - name: Install aarch64 cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      
      - name: Configure linker for aarch64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          echo '[target.aarch64-unknown-linux-gnu]' >> .cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> .cargo/config.toml
          
      - name: Update version in Cargo.toml to match release tag
        shell: bash
        run: |
          # Only touch the [package] section; VERSION is validated in the prepare job.
          sed -i.bak '/^\[package\]/,/^\[/ s/^version = ".*"/version = "'"$VERSION"'"/' Cargo.toml
          grep -qx "version = \"$VERSION\"" Cargo.toml || { echo "ERROR: failed to set version in Cargo.toml"; exit 1; }

      - name: Debug info
        run: |
          cat Cargo.toml
          rustc --version
          cargo --version
          echo rustup target list --installed
          rustup target list --installed
          echo rustup toolchain list
          rustup toolchain list

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        
      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          ARCHIVE="${REPO_NAME}-${RELEASE_TAG}-${{ matrix.target }}.tar.gz"
          tar czf "$ARCHIVE" smotra smotra-cli
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Package (Windows)
        shell: bash
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          ARCHIVE="${REPO_NAME}-${RELEASE_TAG}-${{ matrix.target }}.zip"
          7z a "$ARCHIVE" smotra.exe smotra-cli.exe
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Upload artifacts (Unix)
        uses: actions/upload-artifact@v7
        if: matrix.os != 'windows-latest'
        with:
          name: release-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/${{ env.REPO_NAME }}-*.tar.gz
            target/${{ matrix.target }}/release/${{ env.REPO_NAME }}-*.tar.gz.sha256

      - name: Upload artifacts (Windows)
        uses: actions/upload-artifact@v7
        if: matrix.os == 'windows-latest'
        with:
          name: release-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/${{ env.REPO_NAME }}-*.zip
            target/${{ matrix.target }}/release/${{ env.REPO_NAME }}-*.zip.sha256

  deploy-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ env.RELEASE_TAG }}
    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Debug info
        run: |
          tree -a -L 2 . 
          ls -la artifacts

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for file in artifacts/*.tar.gz artifacts/*.zip artifacts/*.sha256; do
            # Ensure the file actually exists before trying to upload
            [ -e "$file" ] || continue
            gh release upload "${RELEASE_TAG}" "${file}" --clobber
          done
            
  deploy-github-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main branch for install script
        uses: actions/checkout@v7
        with:
          path: main
        
      - name: Organize release files
        run: |
          mkdir html
          cd html
                    
          # Copy install script from main branch
          cp ../main/deployments/install-script/smotra.sh smotra.sh
          chmod +x smotra.sh
          
          # Create index.html for documentation
          cat > index.html <<EOF
          <!DOCTYPE html>
          <html>
          <head>
              <title>Smotra Agent Install</title>
              <meta charset="utf-8">
              <style>
                  body { font-family: sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
                  pre { background: #f4f4f4; padding: 15px; border-radius: 5px; overflow-x: auto; }
                  code { background: #f4f4f4; padding: 2px 5px; border-radius: 3px; }
              </style>
          </head>
          <body>
              <h1>Smotra Agent Installation</h1>
              <p>Latest Version: <strong>${RELEASE_TAG}</strong></p>
              
              <h2>Quick Install</h2>
              <pre><code>curl -fsSL https://install.smotra.net/smotra.sh | sh</code></pre>
              
              <h2>Documentation</h2>
              <p>Visit <a href="https://github.com/${{ github.repository }}">GitHub Repository</a> for full documentation.</p>
          </body>
          </html>
          EOF
        
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './html/' # Upload html directory (or your build folder if using a generator)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        